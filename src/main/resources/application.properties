
spring.application.name=portfolio-backend

# Database: credentials supplied through environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.web.context=INFO
logging.level.org.springframework.web=INFO

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Hosting port
server.port=${PORT:8080}

# Supabase Storage
supabase.url=https://azlkicpqdpmouyxfmofm.supabase.co
supabase.bucket=portfolio-certificates
supabase.secret-key=${SUPABASE_SECRET_KEY}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
